<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="GitHub streak stats">
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; }
    .big { font-size: 28px; font-weight: 700; fill: #F8D866; }
    .cur { font-size: 32px; font-weight: 800; fill: #F8D866; }
    .lbl { font-size: 14px; font-weight: 600; fill: #4B8DC9; }
    .lblc { font-size: 15px; font-weight: 700; fill: #F8D866; }
    .rng { font-size: 12px; fill: #9aa3b5; }
  </style>
  <rect x="0.5" y="0.5" width="494" height="194" rx="4.5" fill="#1F222E" stroke="#3a3f55"/>
  <line x1="165" y1="35" x2="165" y2="160" stroke="#3a3f55"/>
  <line x1="330" y1="35" x2="330" y2="160" stroke="#3a3f55"/>

  <g text-anchor="middle">
    <text x="82.5" y="82" class="big">3,317</text>
    <text x="82.5" y="112" class="lbl">Total Contributions</text>
    <text x="82.5" y="135" class="rng">Nov 4, 2021 - Present</text>

    <circle cx="247.5" cy="72" r="38" fill="none" stroke="#F8D866" stroke-width="5"/>
    <text x="247.5" y="83" class="cur">58</text>
    <text x="247.5" y="132" class="lblc">Current Streak</text>
    <text x="247.5" y="153" class="rng">Sep 13, 2026 - Present</text>

    <text x="412.5" y="82" class="big">58</text>
    <text x="412.5" y="112" class="lbl">Longest Streak</text>
    <text x="412.5" y="135" class="rng">Sep 13, 2026 - Present</text>
  </g>
</svg>
